# Managed by chezmoi (dotfiles). See ops/fedora-kde-updates in Obsidian vault.
# Download updates automatically; apply manually with plasma-safe-upgrade.

[commands]
upgrade_type = default
apply_updates = no
download_updates = yes

# Optional: email notifications (requires mail setup)
# email_from = root@example.com
# email_to = root

[emitters]
emit_via = stdio
